app = 'portfolio-api-rfabreu'
primary_region = 'yyz'

[build]

[env]
  # Key the rate limiter on Fly-Client-IP. Safe only while every request reaches the app through Fly Proxy.
  TRUST_FLY_CLIENT_IP = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 20
    hard_limit = 25

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
