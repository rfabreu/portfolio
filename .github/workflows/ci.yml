name: CI

on:
  pull_request:
    branches: [main]

jobs:
  frontend-check:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - run: npm test

      # Last so a failing audit does not hide the check/build/test results.
      # Includes dev dependencies on purpose: the build and test toolchain
      # runs on this runner and on Netlify's build machine.
      # Fails on high/critical advisories not allowlisted (with expiry) in the script.
      - name: Audit npm dependencies
        run: |
          node --test ../.github/scripts/npm-audit-gate.test.mjs
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node ../.github/scripts/npm-audit-gate.mjs "$RUNNER_TEMP/npm-audit.json"

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Generate Resume PDF
        run: npm run build:pdf

      - run: npm run test:e2e

  api-check:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Sync content for embedding
        run: make sync-content

      - run: go vet ./...
      - run: go test ./... -v
      - run: go build ./cmd/server

      # Needs the embed directory from `make sync-content` above. Pinned to a
      # released version, not @latest; bump it deliberately.
      - name: Scan Go dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
