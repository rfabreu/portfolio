# Dependency update PRs. Nothing here auto-merges: every update arrives as a PR,
# runs the same CI as any other change (Frontend, Frontend E2E, API) and needs
# the owner's approval, because `main` deploys to production on push.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # TypeScript 7 is not supported by `@astrojs/check` (peer range
    # `^5.0.0 || ^6.0.0`). Revisit when an `@astrojs/check` release lists ^7 in
    # its typescript peer range. `versions` (not `update-types`) lets 6.x through.
    ignore:
      - dependency-name: typescript
        versions:
          - ">=7.0.0"
    # Both packages must share one version, so this group has no
    # `update-types` and also takes majors. `npm-minor-patch` excludes them
    # explicitly so the result does not depend on group order.
    groups:
      playwright:
        patterns:
          - playwright
          - "@playwright/test"
      npm-minor-patch:
        exclude-patterns:
          - playwright
          - "@playwright/test"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      gomod-minor-patch:
        update-types:
          - minor
          - patch

  # The API image's base images (`golang` builder, `alpine` runtime). Alpine
  # went stale unnoticed before this entry existed. A bump here changes
  # `api/Dockerfile`, so merging it deploys the API to Fly.io. It does not touch
  # `go.mod` or the `go-version` in the workflows; keep those in step by hand.
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    # Majors are grouped too: action bumps touch `.github/` only and never deploy.
    groups:
      actions:
        update-types:
          - major
          - minor
          - patch
